spring:
  application:
    name: ingredient-client


management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'

---
spring:
  config:
    activate:
      on-profile: docker
  boot:
    admin:
      client:
        url: http://boot-admin:9090

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
